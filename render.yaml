services:
  - type: web
    name: myos
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOTION_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NOTION_DAILY_SOURCE
        sync: false
      - key: NOTION_EXERCISES_SOURCE
        sync: false
      - key: NOTION_GOALS_SOURCE
        sync: false
      - key: NOTION_TARGETS_SOURCE
        sync: false
      - key: NOTION_BODY_SOURCE
        sync: false
      - key: NOTION_FOODS_SOURCE
        sync: false
      - key: NOTION_MEALS_SOURCE
        sync: false
      - key: NOTION_PLANNER_SOURCE
        sync: false
      - key: NOTION_SUPPLEMENTS_SOURCE
        sync: false