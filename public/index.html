<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#141b16" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="A private training and nutrition dashboard connected to Notion." />
  <title>MYOS — MYOS Fitness Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/app.js"></script>
</head>
<body>
<div id="app" class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 27L17 11L23 28L34 11"/><path d="M6 32H34"/></svg></div>
      <div><span class="brand-name">FORM<span class="brand-dot">.</span></span><span class="brand-sub">your fitness studio</span></div>
    </div>
    <div class="nav-label">YOUR SPACE</div>
    <nav id="navigation" class="nav-list">
      <a href="#dashboard" data-route="dashboard" class="nav-link active"><span data-icon="dashboard"></span> Overview</a>
      <a href="#nutrition" data-route="nutrition" class="nav-link"><span data-icon="nutrition"></span> Nutrition</a>
      <a href="#exercises" data-route="exercises" class="nav-link"><span data-icon="dumbbell"></span> Exercises</a>
      <a href="#body" data-route="body" class="nav-link"><span data-icon="activity"></span> Body progress</a>
      <a href="#goals" data-route="goals" class="nav-link"><span data-icon="target"></span> Goals</a>
      <a href="#analytics" data-route="analytics" class="nav-link"><span data-icon="chart"></span> Analytics</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-mini-card">
        <div class="leaf-symbol">✳</div>
        <div class="sidebar-mini-title">One day at a time.</div>
        <p>Small actions. Stronger habits. Your own pace.</p>
        <div class="stripe"></div>
      </div>
      <a href="#settings" data-route="settings" class="nav-link settings-link"><span data-icon="settings"></span> Settings</a>
      <div class="profile-row"><div class="profile-avatar">M</div><div><b>My Studio</b><small id="mode-label">Personal workspace</small></div><span class="profile-dot"></span></div>
    </div>
  </aside>
  <div class="page-wrap">
    <header class="topbar">
      <div class="mobile-brand"><button id="menu-toggle" aria-label="Open menu" class="icon-button"><span data-icon="menu"></span></button><b>MYOS.</b></div>
      <div class="crumb" id="breadcrumb"><span class="crumb-parent">MY SPACE</span><span class="crumb-sep">/</span><strong>Overview</strong></div>
      <div class="header-right"><span id="connection-badge" class="connection-pill"><span class="green-dot"></span> Demo mode</span><span class="header-divider"></span><button class="icon-button" id="refresh-button" title="Refresh from Notion"><span data-icon="refresh"></span></button><div class="top-avatar">M</div></div>
    </header>
    <main id="main-content" tabindex="-1"><div class="loading-screen"><span class="loading-ring"></span><p>Loading your studio…</p></div></main>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
